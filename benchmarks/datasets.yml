# Benchmark datasets for MAS modernization runs. This file is the manifest
# that feeds `mise run cli -- <config>`: one run config per (tool, project)
# pair. Each run config points at one dataset root below.
#
# Dataset roots point into the assets/ReCodeAgent submodule checkout. The
# source-language dir is the run's source root. The sibling target-language
# dir is ReCodeAgent's reference, not the run's input.

datasets:
  crust: # C -> Rust
    source_language: c
    target_language: rust
    root: assets/ReCodeAgent/data/tool_projects/crust
  oxidizer: # Go -> Rust
    source_language: go
    target_language: rust
    root: assets/ReCodeAgent/data/tool_projects/oxidizer
  alphatrans: # Java -> Python
    source_language: java
    target_language: python
    root: assets/ReCodeAgent/data/tool_projects/alphatrans
  skel: # Python -> JavaScript
    source_language: python
    target_language: javascript
    root: assets/ReCodeAgent/data/tool_projects/skel
