[package]
name = "ARCMiS-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line entrypoint for ARCMiS runs."

[[bin]]
name = "cli"
path = "src/main.rs"

[dependencies]
mas-core = { package = "ARCMiS-mas-core", path = "../../lib/mas-core" }
run-config = { package = "ARCMiS-run-config", path = "../../lib/run-config" }
error = { package = "ARCMiS-error", path = "../../lib/error" }
gateway = { package = "ARCMiS-gateway", path = "../../lib/gateway" }
hierarchy = { package = "ARCMiS-hierarchy", path = "../../lib/hierarchy" }
router = { package = "ARCMiS-router", path = "../../lib/router" }
taskgraph = { package = "ARCMiS-taskgraph", path = "../../lib/taskgraph" }
transport = { package = "ARCMiS-transport", path = "../../lib/transport" }
verdict = { package = "ARCMiS-verdict", path = "../../lib/verdict" }

laya-rs.workspace = true

anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
