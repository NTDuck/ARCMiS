[package]
name = "arcmis-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent orchestration domain for ARCMiS."

[dependencies]
arcmis-tools = { path = "../tools" }
rig = "0.42"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tokio = { workspace = true, features = ["process", "macros"] }
tracing = "0.1"
bon = "3.10.1"

[dev-dependencies]
cucumber.workspace = true
tokio = { workspace = true }

[features]
cucumber-tests = []

[[test]]
name = "cucumber"
harness = false
required-features = ["cucumber-tests"]
