[package]
name = "ARCMiS-mas-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Conductor runtime: static hierarchy, dynamic routing, tool gateway, compaction over the omp transport."

[lib]
name = "mas_core"

[dependencies]
runtime = { package = "ARCMiS-runtime", path = "../runtime" }
domain = { package = "ARCMiS-domain", path = "../domain" }
artifact = { package = "ARCMiS-artifact", path = "../artifact" }
decision = { package = "ARCMiS-decision", path = "../decision" }
taskgraph = { package = "ARCMiS-taskgraph", path = "../taskgraph" }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "rt-multi-thread", "time"] }

[lints]
workspace = true
