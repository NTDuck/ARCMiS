[package]
name = "ARCMiS-mas-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Conductor runtime: static hierarchy, dynamic routing, tool gateway, compaction over the omp transport."

[lib]
name = "mas_core"

[dependencies]
error = { package = "ARCMiS-error", path = "../error" }
frames = { package = "ARCMiS-frames", path = "../frames" }
compact = { package = "ARCMiS-compact", path = "../compact" }
transport = { package = "ARCMiS-transport", path = "../transport" }
hierarchy = { package = "ARCMiS-hierarchy", path = "../hierarchy" }
phase = { package = "ARCMiS-phase", path = "../phase" }
gateway = { package = "ARCMiS-gateway", path = "../gateway" }
verdict = { package = "ARCMiS-verdict", path = "../verdict" }
taskgraph = { package = "ARCMiS-taskgraph", path = "../taskgraph" }
router = { package = "ARCMiS-router", path = "../router" }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "rt-multi-thread", "time"] }

[lints]
workspace = true
