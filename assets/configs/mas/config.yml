# MAS migration run configuration, GildedRose-Refactoring-Kata.
# The agent reads tool logs. The agent does not hardcode anything from this
# file; every value here reaches the run through the config loader.

run:
  # Provider: ollama (native protocol) or netmind (OpenAI-compatible).
  provider: ollama
  model: recodeagent-sft
  # Base fallback when the fine-tuned model is absent:
  # qwen3.8:27b-mtp-q4_K_M (see qlora/scripts/merge_and_export.sh).
  max_turns: 60
  num_ctx: 65536
  max_output_tokens: 16384
  max_retries: 1
  think: false
  temperature: 0.2

output:
  dir: .artifacts/GildedRose-Refactoring-Kata/Rust

source:
  language: c
  root: assets/GildedRose-Refactoring-Kata/C
  target:
    language: rust
    test_command: cargo test

# MAS method configuration. Ignored by the other methods.
mas:
  # Manager-loop round ceiling across the whole run.
  max_rounds: 60
  # Manager turn budget per round.
  manager_turns: 20
  # Specialist turn budget per delegation.
  worker_turns: 40
  judge_turns: 60
  # Repair attempts per diagnosed failure before escalation.
  max_repairs: 2
  # Consecutive rounds with no completed task before the manager escalates.
  stagnation_rounds: 6
  # plan.md and notes.md character caps (GVS5H working-file discipline).
  plan_cap: 4000
  notes_cap: 8000
  # Model ladder, weakest first. The fleet analyst promotes along this list.
  # Keep the entries to models the local ollama daemon actually serves; the
  # preflight fails fast otherwise.
  model_ladder:
    - qwen3.8:27b-mtp-q4_K_M
  # Characterization tests the tester may write per module.
  max_generated_tests_per_module: 4
  # Dynamic orchestration (ADR 0022): ready-set breadth per round and the
  # turn budget for one team collective member.
  fanout: 2
  collective_turns: 40
  # Jev-as-a-guard: the model-arbitration tier stays off while the caller's
  # model is the only one available; deny patterns ride the code defaults.
  guard:
    ask_model: false

# Snapcompact PNG-frame archival for all agents (0 disables).
snapcompact:
  threshold_tokens: 12000
  keep_recent_tokens: 4000
