# Benchmark run configuration, generated per sample by
# scripts/bench/run-benchmark.sh. Generous ceilings: a run must not end from a
# model failure, a context overflow (snapcompact absorbs it), or a turn/round
# ceiling. Values are high finite numbers because 0 means "zero" in both the
# rig turn loop and the driver round range, not "unlimited".

run:
  provider: ollama
  model: smtek/Swift-Qwen3.8-27B:map-k4v
  # Per-agent-call model turns (rig trips MaxTurnsError at the ceiling).
  max_turns: 200
  num_ctx: 65536
  max_output_tokens: 16384
  max_retries: 2
  think: false
  temperature: 0.2

output:
  dir: __OUTPUT_DIR__

source:
  language: __SRC_LANG__
  root: __SOURCE_ROOT__
  target:
    language: __DST_LANG__
    test_command: __TEST_COMMAND__

mas:
  # Driver round range 0..max_rounds; 0 would mean zero rounds, so use a high
  # finite ceiling. ~400 rounds at worst-case round cost stays inside the
  # per-cell wall-clock timeout.
  max_rounds: 400
  manager_turns: 40
  worker_turns: 200
  # Judges read, run the suite, and verdict; a small ceiling stops a
  # validation pass from eating a translator-sized budget.
  judge_turns: 60
  # Repair attempts per diagnosed failure before escalation.
  max_repairs: 6
  # 0 disables the stagnation breaker (breaker.rs skips when 0).
  stagnation_rounds: 0
  plan_cap: 6000
  notes_cap: 12000
  model_ladder:
    - smtek/Swift-Qwen3.8-27B:map-k4v
  max_generated_tests_per_module: 8
  # Dynamic orchestration (ADR 0022): ready-set breadth per round and the
  # turn budget for one team collective member.
  fanout: 2
  collective_turns: 200
  # Jev-as-a-guard: deterministic deny patterns; the model-arbitration tier
  # stays off while the caller's model is the only one available.
  guard:
    deny:
      - "rm -rf"
      - "git push"
      - "git reset --hard"
      - "curl "
      - "wget "
      - "pip install"
      - "cargo install"
      - "npm install"
      - "sudo "
    ask_model: false

# Snapcompact PNG-frame archival for all agents (0 disables).
snapcompact:
  threshold_tokens: 24000
  keep_recent_tokens: 8000
