# Virtual workspace manifest. Member crates live under lib/* and bin/*.
[workspace]
resolver = "2"
members = ["ARCMiS/lib/*", "ARCMiS/bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/NTDuck/ARCMiS"
description = "Agentic Repository-level Code Migration for SLMs"

[workspace.dependencies]
bon = "3.10.1"
cucumber = "0.21.1"
rig = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.clippy]
let_and_return = "allow"
