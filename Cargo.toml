# Virtual workspace manifest. Member crates live under lib/* and bin/*.
[workspace]
resolver = "2"
members = ["ARCMiS/lib/*", "ARCMiS/bin/*"]
exclude = [".artifacts", "assets"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/NTDuck/ARCMiS"
description = "Agentic Repository-level Code Migration for SLMs"

[workspace.dependencies]
anyhow = "1.0.104"
bdf-parser = "0.1.0"
cucumber = "0.21.1"
image = { version = "0.25", default-features = false, features = ["png"] }
laya-rs = { version = "0.1", default-features = false }
oxi-hashline = "0.64.0"
petgraph = "0.8.3"
rig = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
time = { version = "0.3.55", features = ["formatting", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "system-proxy"] }

[workspace.lints.clippy]
let_and_return = "allow"
too_many_arguments = "allow"
