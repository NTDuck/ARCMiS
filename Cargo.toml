# Virtual workspace manifest. Member crates live under lib/* and bin/*.
[workspace]
resolver = "2"
members = ["lib/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/NTDuck/ARCMiS"
description = "Agentic Repository-level Code Migration for SLMs"

[workspace.dependencies]
cucumber = "0.21.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.clippy]
let_and_return = "allow"
