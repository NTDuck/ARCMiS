# Command aliases for this repository. Run with: mise run <name>
# These replace the cargo aliases that lived in .cargo/config.toml. See docs/adr/0004.

# Declared toolchains for the benchmark sweep (bench/). The sweep
# scores with the SYSTEM toolchains, not mise-managed ones; this table is the
# declaration of record (all-or-none rule). Verify before a sweep:
#   cargo --version && go version && node --version && java -version
#   .venv-bench/bin/python -m pytest --version
# System minimums: rust >= 1.90, go >= 1.24, node >= 22, java 21, python 3.13.
[tasks.dev]
run = "RUST_LOG=debug cargo run --bin harness"

[tasks.lint-rustfmt]
run = "cargo fmt --all"

[tasks.lint-clippy]
run = "cargo clippy --fix --workspace --all-targets --allow-dirty"

# Serve the ops dashboard (.dashboard SvelteKit app) via vite dev.
[tasks.dashboard]
dir = ".dashboard"
run = "npm run dev"
