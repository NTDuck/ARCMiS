# Command aliases for this repository. Run with: mise run <name>
# These replace the cargo aliases that lived in .cargo/config.toml. See docs/adr/0004.

[tasks.lint-rustfmt]
description = "cargo fmt --all"
run = "cargo fmt --all"

[tasks.lint-clippy]
description = "cargo clippy --fix --workspace --all-targets --allow-dirty"
run = "cargo clippy --fix --workspace --all-targets --allow-dirty"

