run:
  # provider selects the OpenAI-compatible wire path only; the serving
  # engine is q27 (NETMIND_BASE_URL -> ENGINE_URL http://localhost:8081/v1).
  model: s9vb2kbnw3w6xq4gxrmg20s5jqhy7vrj-bonsai2-27b-t3-mtp-slim
  provider: netmind
  max_turns: 14
  num_ctx: 65536
  max_output_tokens: 8192
  max_retries: 4
  think: true
  temperature: 0.2
output:
  dir: @OUTDIR@
source:
  language: @SOURCE_LANG@
  root: @PROBLEM_ROOT@
  target:
    language: rust
    test_command: sh -c '(cd target 2>/dev/null && cargo test) || cargo test'
mas:
  # WHY: q27-era evidence — bigint s26 hit the 20-round ceiling exactly
  # (rounds: 20, completed: false, still in Discovery) and commons-csv
  # rounds burned 8 max-turn deaths each. Ceilings, not capability,
  # bound those rounds.
  fanout: 1
  max_rounds: 30
  orchestrator_turns: 20
  worker_turns: 60
  judge_turns: 40
  role_output_tokens:
    # WHY: 16384-cap translator gens took 12-24 min each under 4-way
    # concurrency (13/21 slow gens pinned exactly at cap on s0). 8192
    # halves worst-case gen time; retry re-prompts with context kept.
    translator: 8192
    architect: 16384
    repairer: 16384
    orchestrator: 16384
  role_think:
    translator: false
    orchestrator: false
    repairer: false
  hierarchy:
    enabled: true
    deny_direct: true
    teams:
      - lead: migration-lead
        members: [translator, validator, tester, repairer]
        turns: 16
        stagnation_rounds: 3
      - lead: discovery-lead
        members: [analyst, architect]
        turns: 10
        stagnation_rounds: 3
      - lead: integration-lead
        members: [planner, failure-analyst, critic]
        turns: 10
        stagnation_rounds: 3

snapcompact:
  # Match the tuned campaign default (assets/configs/mas/config.yml).
  # Zeroing this disabled history compaction for the whole coverage
  # sweep; the v3s14 critic accumulated ~820 KB of source reads and
  # died on context_length_exceeded.
  threshold_tokens: 12000
  keep_recent_tokens: 4000
