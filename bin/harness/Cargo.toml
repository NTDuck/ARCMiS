[package]
name = "harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Binary entry point for ARCMiS."

[dependencies]
arcmis-agents = { path = "../../lib/agents" }
arcmis-tools = { path = "../../lib/tools" }
rig = "0.42"
tokio = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
cucumber.workspace = true

[features]
cucumber-tests = []

[[test]]
name = "cucumber"
harness = false
required-features = ["cucumber-tests"]
