[package]
name = "totp"
version = "0.1.0"
edition = "2021"
description = "TOTP implementation in Rust - from scratch, no external dependencies beyond sha2"

[dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 2

[lib]
name = "totp"
path = "src/lib.rs"

[[bin]]
name = "totp"
path = "src/main.rs"
